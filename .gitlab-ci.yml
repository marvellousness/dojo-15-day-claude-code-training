# Runs lint and JVM unit tests for the Android training app.
# GitLab is unreachable for now, so run the same command locally:
#   cd android-app && ./gradlew lint testDebugUnitTest
android:
  image: eclipse-temurin:21-jdk
  variables:
    ANDROID_HOME: /opt/android-sdk
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip wget > /dev/null
    - mkdir -p $ANDROID_HOME/cmdline-tools
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -O /tmp/tools.zip
    - unzip -q /tmp/tools.zip -d $ANDROID_HOME/cmdline-tools && mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
    - yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
    - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
  script:
    - cd android-app
    - ./gradlew lint testDebugUnitTest --no-daemon
  artifacts:
    when: always
    paths:
      - android-app/app/build/reports/
    reports:
      junit: android-app/app/build/test-results/testDebugUnitTest/*.xml
